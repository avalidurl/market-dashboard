<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Markets Dashboard</title>
  <style>
    :root {
      --bg-primary: #0a0a0a;
      --bg-secondary: #111111;
      --bg-tertiary: #1a1a1a;
      --border: #2a2a2a;
      --text-primary: #e0e0e0;
      --text-secondary: #888888;
      --text-muted: #555555;
      --green: #00c853;
      --red: #ff1744;
      --orange: #ff9100;
      --blue: #2196f3;
      --yellow: #ffd600;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Code', monospace;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-size: 12px;
      line-height: 1.4;
    }

    .header {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 14px;
      font-weight: 600;
      color: var(--orange);
      letter-spacing: 1px;
    }

    .header-info {
      display: flex;
      gap: 20px;
      color: var(--text-secondary);
      font-size: 11px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 2s infinite;
    }

    .status-dot.error {
      background: var(--red);
      animation: none;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1px;
      background: var(--border);
      padding: 1px;
    }

    .section {
      background: var(--bg-secondary);
    }

    .section-header {
      background: var(--bg-tertiary);
      padding: 6px 12px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border);
    }

    .section-header.indices { border-left: 3px solid var(--blue); }
    .section-header.bonds { border-left: 3px solid var(--yellow); }
    .section-header.commodities { border-left: 3px solid var(--orange); }
    .section-header.volatility { border-left: 3px solid var(--red); }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      text-align: left;
      padding: 6px 12px;
      font-size: 9px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      background: var(--bg-tertiary);
      border-bottom: 1px solid var(--border);
    }

    th:not(:first-child) {
      text-align: right;
    }

    td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
    }

    td:not(:first-child) {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    tr:hover {
      background: var(--bg-tertiary);
    }

    .symbol {
      font-weight: 600;
      color: var(--text-primary);
    }

    .name {
      color: var(--text-secondary);
      font-size: 10px;
    }

    .price {
      font-weight: 600;
    }

    .change {
      font-weight: 500;
    }

    .positive { color: var(--green); }
    .negative { color: var(--red); }
    .neutral { color: var(--text-secondary); }

    .loading {
      text-align: center;
      padding: 40px;
      color: var(--text-secondary);
    }

    .error-msg {
      text-align: center;
      padding: 20px;
      color: var(--red);
    }

    .sparkline {
      width: 60px;
      height: 20px;
    }

    .footer {
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--text-muted);
    }

    .key-metrics {
      display: flex;
      gap: 24px;
    }

    .metric {
      display: flex;
      gap: 8px;
    }

    .metric-label {
      color: var(--text-muted);
    }

    .metric-value {
      font-weight: 600;
    }

    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
      }
      .header-info {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>GLOBAL MARKETS</h1>
    <div class="header-info">
      <div class="status">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">LIVE</span>
      </div>
      <div id="lastUpdate">--:--:--</div>
    </div>
  </div>

  <div class="container" id="dashboard">
    <div class="loading">Loading market data...</div>
  </div>

  <div class="footer">
    <div class="key-metrics" id="keyMetrics"></div>
    <div>Data: Yahoo Finance | Refresh: 60s</div>
  </div>

  <script>
    const SYMBOL_META = {
      '^GSPC': { name: 'S&P 500', section: 'indices' },
      '^NDX': { name: 'Nasdaq 100', section: 'indices' },
      '^DJI': { name: 'Dow Jones', section: 'indices' },
      '^STOXX50E': { name: 'Euro Stoxx 50', section: 'indices' },
      '^N225': { name: 'Nikkei 225', section: 'indices' },
      '000001.SS': { name: 'Shanghai Comp', section: 'indices' },
      '^TNX': { name: '10Y Treasury', section: 'bonds' },
      '^TYX': { name: '30Y Treasury', section: 'bonds' },
      '^IRX': { name: '3M T-Bill', section: 'bonds' },
      'TLT': { name: '20Y+ Treasury ETF', section: 'bonds' },
      'HYG': { name: 'High Yield Corp', section: 'bonds' },
      'LQD': { name: 'Inv Grade Corp', section: 'bonds' },
      '^VIX': { name: 'VIX', section: 'volatility' },
      'DX-Y.NYB': { name: 'Dollar Index', section: 'commodities' },
      'GC=F': { name: 'Gold', section: 'commodities' },
      'CL=F': { name: 'Crude Oil WTI', section: 'commodities' },
      'HG=F': { name: 'Copper', section: 'commodities' },
    };

    const SECTIONS = {
      indices: 'Equity Indices',
      bonds: 'Rates & Credit',
      volatility: 'Volatility',
      commodities: 'FX & Commodities'
    };

    function formatNumber(num, decimals = 2) {
      if (num === null || num === undefined) return '--';
      return num.toLocaleString('en-US', {
        minimumFractionDigits: decimals,
        maximumFractionDigits: decimals
      });
    }

    function formatChange(change, pct) {
      if (change === null || change === undefined) return { text: '--', class: 'neutral' };
      const sign = change >= 0 ? '+' : '';
      const cls = change > 0 ? 'positive' : change < 0 ? 'negative' : 'neutral';
      return {
        text: `${sign}${formatNumber(change)} (${sign}${formatNumber(pct)}%)`,
        class: cls
      };
    }

    function createSection(id, title, quotes) {
      const section = document.createElement('div');
      section.className = 'section';
      section.innerHTML = `
        <div class="section-header ${id}">${title}</div>
        <table>
          <thead>
            <tr>
              <th>Symbol</th>
              <th>Last</th>
              <th>Change</th>
            </tr>
          </thead>
          <tbody>
            ${quotes.map(q => {
              const change = formatChange(q.regularMarketChange, q.regularMarketChangePercent);
              const price = q.regularMarketPrice ?? q.regularMarketPreviousClose;
              return `
                <tr>
                  <td>
                    <div class="symbol">${q.displaySymbol}</div>
                    <div class="name">${q.displayName}</div>
                  </td>
                  <td class="price">${formatNumber(price, id === 'bonds' ? 3 : 2)}</td>
                  <td class="change ${change.class}">${change.text}</td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      `;
      return section;
    }

    function updateKeyMetrics(quotes) {
      const metrics = [];
      const sp500 = quotes.find(q => q.symbol === '^GSPC');
      const vix = quotes.find(q => q.symbol === '^VIX');
      const tny = quotes.find(q => q.symbol === '^TNX');
      const dxy = quotes.find(q => q.symbol === 'DX-Y.NYB');

      if (sp500) {
        const cls = sp500.regularMarketChangePercent >= 0 ? 'positive' : 'negative';
        metrics.push(`<div class="metric"><span class="metric-label">SPX:</span><span class="metric-value ${cls}">${formatNumber(sp500.regularMarketPrice)}</span></div>`);
      }
      if (vix) {
        const cls = vix.regularMarketPrice > 20 ? 'negative' : 'positive';
        metrics.push(`<div class="metric"><span class="metric-label">VIX:</span><span class="metric-value ${cls}">${formatNumber(vix.regularMarketPrice)}</span></div>`);
      }
      if (tny) {
        metrics.push(`<div class="metric"><span class="metric-label">10Y:</span><span class="metric-value">${formatNumber(tny.regularMarketPrice, 3)}%</span></div>`);
      }
      if (dxy) {
        metrics.push(`<div class="metric"><span class="metric-label">DXY:</span><span class="metric-value">${formatNumber(dxy.regularMarketPrice)}</span></div>`);
      }

      document.getElementById('keyMetrics').innerHTML = metrics.join('');
    }

    async function fetchData() {
      try {
        const response = await fetch('/api/quotes');
        if (!response.ok) throw new Error('Failed to fetch');
        const data = await response.json();

        if (data.error) throw new Error(data.error);

        const quotes = data.quoteResponse?.result || [];

        // Organize by section
        const sections = { indices: [], bonds: [], volatility: [], commodities: [] };

        quotes.forEach(q => {
          const meta = SYMBOL_META[q.symbol];
          if (meta) {
            sections[meta.section].push({
              ...q,
              displaySymbol: q.symbol.replace('^', ''),
              displayName: meta.name
            });
          }
        });

        // Render dashboard
        const dashboard = document.getElementById('dashboard');
        dashboard.innerHTML = '';

        Object.entries(SECTIONS).forEach(([id, title]) => {
          if (sections[id].length > 0) {
            dashboard.appendChild(createSection(id, title, sections[id]));
          }
        });

        updateKeyMetrics(quotes);

        // Update status
        document.getElementById('statusDot').classList.remove('error');
        document.getElementById('statusText').textContent = 'LIVE';
        document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();

      } catch (error) {
        console.error('Error:', error);
        document.getElementById('statusDot').classList.add('error');
        document.getElementById('statusText').textContent = 'ERROR';
      }
    }

    // Initial fetch
    fetchData();

    // Refresh every 60 seconds
    setInterval(fetchData, 60000);
  </script>
</body>
</html>
