<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PULSE / Global Markets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a;
      --bg-card: #111;
      --bg-accent: #1a1a1a;
      --text: #e8e4df;
      --text-dim: #6b6860;
      --text-muted: #3d3a35;
      --border: #252320;
      --accent: #f0c674;
      --up: #7dcea0;
      --up-bg: rgba(125, 206, 160, 0.08);
      --down: #e57373;
      --down-bg: rgba(229, 115, 115, 0.08);
      --highlight: #f0c674;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Mono', monospace;
      background: var(--bg);
      color: var(--text);
      font-size: 12px;
      line-height: 1.5;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Grain overlay */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      opacity: 0.03;
      pointer-events: none;
      z-index: 1000;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: linear-gradient(180deg, var(--bg) 0%, rgba(10,10,10,0.95) 100%);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      max-width: 1600px;
      margin: 0 auto;
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 24px;
      letter-spacing: -1px;
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .logo span {
      font-weight: 400;
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 11px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .live-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pulse {
      width: 6px;
      height: 6px;
      background: var(--up);
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(125, 206, 160, 0.4); }
      50% { opacity: 0.6; box-shadow: 0 0 0 6px rgba(125, 206, 160, 0); }
    }

    /* Hero */
    .hero {
      max-width: 1600px;
      margin: 0 auto;
      padding: 60px 32px 40px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 60px;
      align-items: end;
      border-bottom: 1px solid var(--border);
    }

    .hero-left h1 {
      font-family: 'Instrument Serif', serif;
      font-size: clamp(48px, 8vw, 96px);
      font-weight: 400;
      line-height: 0.95;
      letter-spacing: -2px;
      margin-bottom: 16px;
    }

    .hero-left h1 em {
      font-style: italic;
      color: var(--accent);
    }

    .hero-tagline {
      font-size: 13px;
      color: var(--text-dim);
      max-width: 400px;
      line-height: 1.6;
    }

    .hero-right {
      display: flex;
      gap: 1px;
      background: var(--border);
    }

    .hero-stat {
      background: var(--bg);
      padding: 20px 28px;
      min-width: 140px;
    }

    .hero-stat-label {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
    }

    .hero-stat-value {
      font-family: 'Syne', sans-serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -1px;
    }

    .hero-stat-change {
      font-size: 11px;
      margin-top: 4px;
    }

    /* Main content */
    main {
      max-width: 1600px;
      margin: 0 auto;
      padding: 40px 32px;
    }

    /* Section */
    .section {
      margin-bottom: 64px;
    }

    .section-header {
      display: flex;
      align-items: baseline;
      gap: 16px;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .section-title {
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .section-subtitle {
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    /* Data table */
    .data-table {
      display: grid;
      gap: 1px;
      background: var(--border);
    }

    .data-row {
      display: grid;
      grid-template-columns: 160px 1fr 120px 140px 100px 180px;
      background: var(--bg);
      transition: background 0.15s ease;
    }

    .data-row:hover {
      background: var(--bg-card);
    }

    .data-row.header-row {
      background: var(--bg-accent);
    }

    .data-row.header-row .data-cell {
      font-size: 9px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      padding: 12px 16px;
    }

    .data-cell {
      padding: 16px;
      display: flex;
      align-items: center;
      border-right: 1px solid var(--border);
    }

    .data-cell:last-child {
      border-right: none;
    }

    .ticker-cell {
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
    }

    .ticker {
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .ticker-name {
      font-size: 10px;
      color: var(--text-dim);
    }

    .price-cell {
      font-family: 'Syne', sans-serif;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.5px;
    }

    .change-cell {
      justify-content: flex-end;
      font-size: 12px;
      font-weight: 500;
    }

    .up { color: var(--up); }
    .down { color: var(--down); }

    .ytd-cell {
      justify-content: flex-end;
    }

    .volume-cell {
      justify-content: flex-end;
      color: var(--text-dim);
    }

    /* 52-week range */
    .range-cell {
      flex-direction: column;
      gap: 6px;
    }

    .range-bar-container {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .range-val {
      font-size: 9px;
      color: var(--text-muted);
      width: 40px;
    }

    .range-val.high {
      text-align: right;
    }

    .range-bar {
      flex: 1;
      height: 3px;
      background: var(--bg-accent);
      border-radius: 2px;
      position: relative;
    }

    .range-track {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      background: linear-gradient(90deg, var(--down) 0%, var(--text-muted) 50%, var(--up) 100%);
      border-radius: 2px;
      opacity: 0.4;
    }

    .range-marker {
      position: absolute;
      top: 50%;
      width: 9px;
      height: 9px;
      background: var(--text);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 0 2px var(--bg);
    }

    /* Footer */
    footer {
      border-top: 1px solid var(--border);
      padding: 24px 32px;
      max-width: 1600px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Loading */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 120px;
      gap: 16px;
      color: var(--text-dim);
    }

    .loader {
      width: 24px;
      height: 24px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Responsive */
    @media (max-width: 1200px) {
      .data-row {
        grid-template-columns: 140px 1fr 100px 120px 80px 160px;
      }
    }

    @media (max-width: 900px) {
      .hero {
        grid-template-columns: 1fr;
        gap: 32px;
        padding: 40px 20px 32px;
      }

      .hero-right {
        flex-wrap: wrap;
      }

      .header-inner, main, footer {
        padding-left: 20px;
        padding-right: 20px;
      }

      .data-row {
        grid-template-columns: 1fr 1fr;
        gap: 1px;
      }

      .data-row.header-row {
        display: none;
      }

      .data-cell {
        padding: 12px;
      }

      .ticker-cell {
        grid-column: span 2;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        background: var(--bg-accent);
      }

      .range-cell {
        grid-column: span 2;
      }
    }

    /* Special VIX styling */
    .vix-warning {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="logo">PULSE <span>Global Markets</span></div>
      <div class="status">
        <span id="lastUpdate">—</span>
        <div class="live-indicator">
          <div class="pulse" id="statusDot"></div>
          <span id="statusText">Connecting</span>
        </div>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="hero-left">
      <h1>Markets<br/><em>at a glance</em></h1>
      <p class="hero-tagline">Real-time tracking of global equities, fixed income, commodities, and volatility indicators.</p>
    </div>
    <div class="hero-right" id="heroStats"></div>
  </section>

  <main id="main">
    <div class="loading">
      <div class="loader"></div>
      <span>Loading market data</span>
    </div>
  </main>

  <footer>
    <span>Data via Yahoo Finance • 15 min delay</span>
    <span>Built with Cloudflare Workers</span>
  </footer>

  <script>
    const SECTIONS = {
      indices: { title: 'Equities', subtitle: 'Major indices' },
      volatility: { title: 'Volatility', subtitle: 'Fear gauge' },
      bonds: { title: 'Fixed Income', subtitle: 'Treasury & corporate' },
      commodities: { title: 'Commodities', subtitle: 'Materials & FX' }
    };

    function fmt(n, d = 2) {
      if (n == null) return '—';
      return n.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
    }

    function fmtVol(n) {
      if (n == null) return '—';
      if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B';
      if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
      if (n >= 1e3) return (n / 1e3).toFixed(0) + 'K';
      return n.toString();
    }

    function createRow(q) {
      const chg = q.regularMarketChangePercent;
      const cls = chg > 0 ? 'up' : chg < 0 ? 'down' : '';
      const sign = chg >= 0 ? '+' : '';

      const ytd = q.ytdChangePercent;
      const ytdCls = ytd > 0 ? 'up' : ytd < 0 ? 'down' : '';
      const ytdSign = ytd >= 0 ? '+' : '';

      const range = q.fiftyTwoWeekHigh - q.fiftyTwoWeekLow;
      const pos = range > 0 ? ((q.regularMarketPrice - q.fiftyTwoWeekLow) / range) * 100 : 50;

      return `
        <div class="data-row">
          <div class="data-cell ticker-cell">
            <span class="ticker">${q.symbol}</span>
            <span class="ticker-name">${q.displayName}</span>
          </div>
          <div class="data-cell price-cell">${fmt(q.regularMarketPrice)}</div>
          <div class="data-cell change-cell ${cls}">${sign}${fmt(chg)}%</div>
          <div class="data-cell ytd-cell ${ytdCls}">${ytd != null ? ytdSign + fmt(ytd) + '%' : '—'}</div>
          <div class="data-cell volume-cell">${fmtVol(q.regularMarketVolume)}</div>
          <div class="data-cell range-cell">
            <div class="range-bar-container">
              <span class="range-val">${fmt(q.fiftyTwoWeekLow, 0)}</span>
              <div class="range-bar">
                <div class="range-track" style="width: 100%"></div>
                <div class="range-marker" style="left: ${Math.min(100, Math.max(0, pos))}%"></div>
              </div>
              <span class="range-val high">${fmt(q.fiftyTwoWeekHigh, 0)}</span>
            </div>
          </div>
        </div>
      `;
    }

    function createSection(id, quotes) {
      const cfg = SECTIONS[id];
      if (!cfg || !quotes.length) return '';

      const headerRow = `
        <div class="data-row header-row">
          <div class="data-cell">Ticker</div>
          <div class="data-cell">Price</div>
          <div class="data-cell">Change</div>
          <div class="data-cell">YTD</div>
          <div class="data-cell">Volume</div>
          <div class="data-cell">52W Range</div>
        </div>
      `;

      return `
        <section class="section">
          <div class="section-header">
            <h2 class="section-title">${cfg.title}</h2>
            <span class="section-subtitle">${cfg.subtitle}</span>
          </div>
          <div class="data-table">
            ${headerRow}
            ${quotes.map(createRow).join('')}
          </div>
        </section>
      `;
    }

    function updateHero(quotes) {
      const spx = quotes.find(q => q.symbol === 'SPX');
      const vix = quotes.find(q => q.symbol === 'VIX');
      const tlt = quotes.find(q => q.symbol === 'TLT');
      const gld = quotes.find(q => q.symbol === 'GLD');

      let html = '';

      if (spx) {
        const cls = spx.regularMarketChangePercent >= 0 ? 'up' : 'down';
        const sign = spx.regularMarketChangePercent >= 0 ? '+' : '';
        html += `
          <div class="hero-stat">
            <div class="hero-stat-label">S&P 500</div>
            <div class="hero-stat-value">${fmt(spx.regularMarketPrice, 0)}</div>
            <div class="hero-stat-change ${cls}">${sign}${fmt(spx.regularMarketChangePercent)}%</div>
          </div>
        `;
      }

      if (vix) {
        const level = vix.regularMarketPrice > 25 ? 'vix-warning' : vix.regularMarketPrice > 18 ? '' : 'up';
        const label = vix.regularMarketPrice > 25 ? 'Elevated' : vix.regularMarketPrice > 18 ? 'Normal' : 'Low';
        html += `
          <div class="hero-stat">
            <div class="hero-stat-label">VIX</div>
            <div class="hero-stat-value ${level}">${fmt(vix.regularMarketPrice, 1)}</div>
            <div class="hero-stat-change">${label}</div>
          </div>
        `;
      }

      if (tlt) {
        const cls = tlt.regularMarketChangePercent >= 0 ? 'up' : 'down';
        const sign = tlt.regularMarketChangePercent >= 0 ? '+' : '';
        html += `
          <div class="hero-stat">
            <div class="hero-stat-label">Bonds</div>
            <div class="hero-stat-value">${fmt(tlt.regularMarketPrice, 0)}</div>
            <div class="hero-stat-change ${cls}">${sign}${fmt(tlt.regularMarketChangePercent)}%</div>
          </div>
        `;
      }

      if (gld) {
        const cls = gld.regularMarketChangePercent >= 0 ? 'up' : 'down';
        const sign = gld.regularMarketChangePercent >= 0 ? '+' : '';
        html += `
          <div class="hero-stat">
            <div class="hero-stat-label">Gold</div>
            <div class="hero-stat-value">${fmt(gld.regularMarketPrice, 0)}</div>
            <div class="hero-stat-change ${cls}">${sign}${fmt(gld.regularMarketChangePercent)}%</div>
          </div>
        `;
      }

      document.getElementById('heroStats').innerHTML = html;
    }

    async function fetchData() {
      try {
        const res = await fetch('/api/quotes');
        if (!res.ok) throw new Error('Fetch failed');
        const data = await res.json();

        const quotes = data.quoteResponse?.result || [];
        const sections = { indices: [], volatility: [], bonds: [], commodities: [] };

        quotes.forEach(q => {
          if (q.section && sections[q.section]) sections[q.section].push(q);
        });

        document.getElementById('main').innerHTML =
          ['indices', 'volatility', 'bonds', 'commodities']
            .map(id => createSection(id, sections[id]))
            .join('');

        updateHero(quotes);

        document.getElementById('statusDot').style.background = 'var(--up)';
        document.getElementById('statusText').textContent = 'Live';
        document.getElementById('lastUpdate').textContent =
          new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });

      } catch (err) {
        console.error(err);
        document.getElementById('statusDot').style.background = 'var(--down)';
        document.getElementById('statusText').textContent = 'Error';
      }
    }

    fetchData();
    setInterval(fetchData, 60000);
  </script>
</body>
</html>
